<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <section>
        <h2>Formulário</h2>
        <form action="cadastro.php" method="post">
            <p> <label>Nome:</label>
                <input type="text" name="nome" placeholder="Digite seu nome" required>
            </p>
            <p> <label>Senha:</label>
                <input type="password" name="senha" placeholder="Digite sua senha" required maxlength="8">
            </p>
            <p> <label>E-mail:</label>
                <input type="email" name="email" placeholder="Digite seu e-mail" required>
            </p>
            <p> <label>Telefone:</label>
                <input type="tel" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="Digite seu telefone" required title="Use formato (XX) XXXXX-XXXX">
            </p>
            <p> <label>CEP:</label>
                <input type="text" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="Digite seu CEP" required title="Use formato XXXXX-XXX">
            </p>
            <p> <label> Sobre Você:</label></p>
            <p></label>
                <textarea name="sobre" rows="5" cols="30" placeholder="Fale um pouco sobre você"></textarea>
            </p>
            <p><label>Gênero:</label></p>
            <input type="radio" name="genero" value="M" required>Masculino
            <input type="radio" name="genero" value="F" required>Feminino
            <p><label> Interesses:</label>
                <input type="checkbox" name="interesses" value="Técnologia">Técnologia
                <input type="checkbox" name="interesses" value="Esportes">Esportes
                <input type="checkbox" name="interesses" value="Arte">Arte
            </p>
            <p><label>Pais:</label></p>
            <select name="pais" required>
                <option value="">--------</option>
                <option value="Brasil">Brasil</option>
                <option value="Argentina">Argentina</option>
                <option value="Estados Unidos">Estados Unidos</option>
                <option value="Japão">Japão</option>
            </select>
            <p><label>Foto de Perfil:</label></p>
            <p>
                <input type="file" name="foto">
            </p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
            <p>
                <input type="submit" value="Cadastrar">
            </p>
        </form>
    </section>
</body>
</html>
