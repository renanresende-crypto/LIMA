<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de Links</title>
    <style>
        header {
            background-color: black;
        }
        h1 {
            color: hotpink;
        }
        /* link normal */
        a:link {
            color: blue;
        /* text-decoration: none; */
        }
        /* link visitado */
        a:visited {
            color: yellow;
        }
        /*quando o mouse passa por cima do link */
        a:hover {
            color: red;
            text-decoration: underline;
            /* text-decoration: underline; */
            font-size: 100px; 
        }
        a:active {
            color: orange;
        
        /*enquanto o link está sendo clicado */
        }
    </style>
</head>
<body>
    <h1> Formatação de Links com CSS</h1>
    <p> <a href="https://www.google.com">Google</a> </p>
</body>
</html>
