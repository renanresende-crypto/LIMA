<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3</title>
</head>

<body>
    <!---- Cabeçalho da página -->
    <header>
        <h1> Cores, Imagens e Links </h1>
    </header>
    <!-- Cores em HTML -->
    <main>
        <section>
            <h2> Cores </h2>
            <p style="color: #ff0000;"> Título com cor em Hexadecimal </p>
            <p style="color: rgb(0, 0, 255);"> Título com cor em RGB </p>
            <p style="color: rgba(0, 128, 0, 0.5);"> Título com cor em RGBA </p>
        </section>
        <hr>
        <!-- Cor de fundo -->
        <section>
            <p style="color: blue;">Texto em uma cor específica!</p>
            <p style="background-color: red;color: white;">Fundo do texto em uma cor específica!</p>
        </section>
        <hr>
        <section>
        <!-- Imagens -->
            <img src="assets/image.png" alt="MT 07" width="200">
        </section>
        <hr>
        <!-- Imagem de fundo -->
         <section>
            <div style="border : 1px solid red; width: 500px;color:
             white; text-align: center; background-image: url('assets/image.png');
              background-size: cover; height: 630px; line-height: 300px;background-repeat: no-repeat;
              background-position: center;">
                <h2> Imagem como Background </h2>
                <p>Esta seção utiliza uma imagem como plano de fundo.</p>
            </div>
         </section>
        <hr>
        <!-- Videos -->
         <section>
           <iframe width="560" height="315" src="https://www.youtube.com/embed/uZn67dD03ac?si=R6VC3-RuVe0PJQTI" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </section>
    </main>
</body>

</html>
